<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Person Responsible for the Book-Maria's Mobile Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/book1-modified.png') }}">
</head>

<body class="text-white indie-flower-regular" style="background-color: #0b6623; background-image: url('{{ url_for('static', filename='images/book_wallpaper.png') }}'); background-repeat: repeat; background-size: 220px; background-blend-mode: overlay; height: 100%; margin: 0;">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 card shadow p-4 border-0 rounded-4" style="background-color: #34495e;">
                <h2 class="text-white mb-4">Update Checkout for "{{ book.title }}"</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-white">Checked Out By (or type 'None'):</label>
                        <input type="text" class="form-control" name="checked_out_by" value="{{ book.checked_out_by }}" required>
                    </div>
                    <button type="submit" class="btn btn-success">Update Checkout</button>
                    <a href="{{ url_for('test', lib_name=lib_name, username=username) }}" class="btn btn-outline-light ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
