<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        html,
        body {
            height: 100%;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-4"></div>
            <h1 class="display-1 col-5 text-right">Place Hold</h1>
            <div class="col-3 text-end">
                <a href="{{ url_for('test', lib_name=lib_name, username=username) }}" class="btn btn-primary">Home</a>
            </div>
        </div>
        <div class="row p-5 justify-content-center bg-secondary">
            <div class="col-4 bg-primary">
                <div class="card">
                    <div class="card-body">
                        <form method="POST">
                            <input type="hidden" name="username" value="{{ username }}">
                            <div class="mb-3">
                                <label class="form-label">Book Name</label>
                                <input class="form-control" name="book_name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Author</label>
                                <input class="form-control" name="author_name">
                            </div>
                            <button type="submit" class="btn btn-primary">Place Hold</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
