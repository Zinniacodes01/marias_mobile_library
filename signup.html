<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        html,
        body {
            height: 100%;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-5"></div>
            <h1 class="display-1 col-4 text-right">Signup</h1>
            <div class="col-3 text-end">
                <a href="login" class="btn btn-primary">Login</a>
                <a href="signup" class="btn btn-secondary">Signup</a>
            </div>
        </div>
        <div class="row p-5 justify-content-center bg-secondary">
            <div class="col-4 bg-primary">
                <div class="card">
                    <div class="card-body">
                        <form action="/" method="POST">
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Username</label>
                                <input type="text" id="exampleInputEmail1" class="form-control" name="username" value="{{ username }}">
                                <div id="emailHelp" class="form-text">Something to add to the mass chaos!</div>
                                <!-- <input type="hidden" id="exampleInputEmail1" name="username" value="{{ username }}"> -->
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">Password</label>
                                <input type="password" for="exampleInputPassword1" class="form-control" name="password" value="{{ password }}">
                                <!-- <input type="hidden" for="exampleInputPassword1" name="password" value="{{ password }}"> -->
                            </div>
                            <div>
                                <a href="join_library" class="btn btn-primary">Join a Library</a>
                                <a href="create_library"class="btn btn-secondary">Create a Library</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
